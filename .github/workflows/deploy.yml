name: Build and deploy complete V5 major atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate full major atlas
        run: node tools/build-atlas.mjs
      - name: Validate full atlas
        run: |
          node --check app.js
          node --check data/atlas-full.js
          node -e "const d=require('./data/atlas-full.json');if(d.majors.length!==100||d.majors.some(m=>!m.overview||m.courses.length!==3||m.salary.length!==3))process.exit(1);console.log('Verified '+d.majors.length+' majors')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
